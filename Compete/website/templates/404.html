{% extends 'base.html' %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="ui container main-container">
    <div class="ui middle aligned center aligned grid" style="min-height: 500px;">
        <div class="column" style="max-width: 600px;">
            <div class="ui segment ctf-card">
                <h1 class="ui red header" style="font-size: 4em; margin-bottom: 20px;">
                    <i class="exclamation triangle icon"></i>
                    404
                </h1>
                
                <h2 class="ui header" style="margin-bottom: 30px;">
                    <div class="content">
                        Page Not Found
                        <div class="sub header">The page you're looking for doesn't exist.</div>
                    </div>
                </h2>

                <div class="ui message">
                    <p>The page you requested could not be found. It might have been moved or deleted.</p>
                </div>

                <div class="ui buttons" style="margin-top: 30px;">
                    <a href="{% url 'home' %}" class="ui primary button">
                        <i class="home icon"></i>
                        Go Home
                    </a>
                    <div class="or"></div>
                    <a href="javascript:history.back()" class="ui button">
                        <i class="arrow left icon"></i>
                        Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
