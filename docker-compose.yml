services:
  web:
    build:
      context: .
    volumes:
      - ./Compete:/app
    environment:
      - DJANGO_SETTINGS_MODULE=Compete.settings
      - JUDGE0_API_URL=http://server:2358
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - DB_NAME=${DB_NAME:-compete_db}
      - DB_USER=${DB_USER:-compete_user}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST:-app_db}
      - DB_PORT=${DB_PORT:-5432}
      - EMAIL_HOST=${EMAIL_HOST:-smtp.postmarkapp.com}
      - EMAIL_PORT=${EMAIL_PORT:-2525}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    command: gunicorn Compete.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - server
      - app_db
    networks:
      - compete-network
      - judge0-network
  server:
    image: judge0/judge0:1.13.1
    privileged: true
    cap_add:
      - SYS_ADMIN
    container_name: judge0_server
    ports:
      - "2358:2358"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${JUDGE0_DB_NAME:-judge0_db}
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
      REDIS_HOST: redis
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
    depends_on:
      - db
      - redis
    networks:
      - judge0-network
    volumes:
      - /home/paul/Compete/box:/box
  workers:
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: judge0_workers
    cgroup: host
    runtime: runsc
    restart: always
    privileged: true
    cap_add:
      - SYS_ADMIN # Needed to mount namespaces (avoid using if gvisor isn't implemented)
      - CHOWN # So Judge0 can modify file permissions in /box
      - SETUID # So the sandbox user can be switched to
      - SETGID
      - DAC_OVERRIDE # Allows isolate to bypass read & write checks (avoid using if possible to mitigate security risks)
    security_opt:
      - label:disable # Disables apparmor and selinux for this container only
      - no-new-privileges:true # Prevents escalation to root
    depends_on:
      - server
      - db
      - redis
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${JUDGE0_DB_NAME:-judge0_db}
      POSTGRES_USER: ${JUDGE0_DB_USER:-judge0}
      POSTGRES_PASSWORD: ${JUDGE0_DB_PASSWORD}
      REDIS_HOST: redis
      QUEUE: "*"
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
    volumes:
      - /home/paul/Compete/box:/box
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /var/local/lib/isolate:/var/local/lib/isolate
    networks:
      - judge0-network
  redis:
    image: redis:7-alpine
    container_name: judge0_redis
    restart: always
    networks:
      - judge0-network
  app_db:
    image: postgres:15
    environment:
      - POSTGRES_DB=${DB_NAME:-compete_db}
      - POSTGRES_USER=${DB_USER:-compete_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    networks:
      - compete-network
  db:
    image: postgres:15
    container_name: judge0_db
    environment:
      - POSTGRES_DB=${JUDGE0_DB_NAME:-judge0_db}
      - POSTGRES_USER=${JUDGE0_DB_USER:-judge0}
      - POSTGRES_PASSWORD=${JUDGE0_DB_PASSWORD}
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    networks:
      - judge0-network
networks:
  compete-network:
    driver: bridge
  judge0-network:
    driver: bridge
    internal: true
volumes:
  app_postgres_data:
  judge0_postgres_data:
