services:
  web:
    build:
      context: .
    volumes:
      - ./Compete:/app
    environment:
      - DJANGO_SETTINGS_MODULE=Compete.settings
      - JUDGE0_API_URL=http://server:2358
    command: gunicorn Compete.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - server
      - app_db
    networks:
      - compete-network
      - judge0-network
  server:
    image: judge0/judge0:1.13.1
    privileged: true
    container_name: judge0_server
    ports:
      - "2358:2358"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: judge0_db
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: Pfw02967+890,/
      REDIS_HOST: redis
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
    depends_on:
      - db
      - redis
    networks:
      - judge0-network
    volumes:
      - /home/paul/Compete/box:/box
  workers:
    build:
      context: .
      dockerfile: Dockerfile.workers
    container_name: judge0_workers
    restart: always
    user: root
    cgroup: host
    privileged: true
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    depends_on:
      - server
      - db
      - redis
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: judge0_db
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: Pfw02967+890,/
      REDIS_HOST: redis
      QUEUE: "*"
      DOCKER_HOST: unix:///var/run/docker.sock
      LANG: en_US.UTF-8
      LANGUAGE: en_US:en
      LC_ALL: en_US.UTF-8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/paul/Compete/box:/box
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - /dev:/dev
      - ./judge0.conf:/etc/judge0.conf:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/local/lib/isolate:/var/local/lib/isolate
    networks:
      - judge0-network
  redis:
    image: redis:7-alpine
    container_name: judge0_redis
    restart: always
    networks:
      - judge0-network
  app_db:
    image: postgres:15
    environment:
      - POSTGRES_DB=compete_db
      - POSTGRES_USER=compete_user
      - POSTGRES_PASSWORD=Pfw02967+890,/
    volumes:
      - app_postgres_data:/var/lib/postgresql/data
    networks:
      - compete-network
  db:
    image: postgres:15
    container_name: judge0_db
    environment:
      - POSTGRES_DB=judge0_db
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=Pfw02967+890,/
    volumes:
      - judge0_postgres_data:/var/lib/postgresql/data
    networks:
      - judge0-network
networks:
  compete-network:
    driver: bridge
  judge0-network:
    driver: bridge
volumes:
  app_postgres_data:
  judge0_postgres_data:
